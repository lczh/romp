# The Rust spike's workspace (rust/SPIKE.md): the transcript store and the feed's per-card build, standalone.
# External crates are added only with lczh's approval, pinned exactly here and in Cargo.lock to versions at least a
# week old when added (tools/rust-spike/check_crate_ages.py). Approved 2026-11-25: serde, serde_json and their deps.
# serde_json's `float_roundtrip` (a feature, no added crate) reads every float as Python's repr wrote it; without it
# 14% of fractional times below 2e9 came back one ULP off (rust/SPIKE.md, S4.1).
[workspace]
resolver = "3"
members = ["crates/romp-json", "crates/romp-transcript", "crates/romp-views", "crates/romp-spike"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
romp-json = { path = "crates/romp-json" }
romp-transcript = { path = "crates/romp-transcript" }
romp-views = { path = "crates/romp-views" }

# S6.1's tuning (rust/SPIKE.md): whole-program LTO and one codegen unit let the build's hot paths inline across the four
# crates; panic = "abort" drops the unwinding tables and landing pads (no code catches a panic: a panic ends the run,
# which every harness reads as a failure, as before). Tests and benches ignore `panic` and keep unwinding.
[profile.release]
debug = 1          # symbols for profiling the measurement runs
lto = "fat"
codegen-units = 1
panic = "abort"

# The memo mutant sweep's profile only (tools/rust-spike/orcd/mutants.sbatch): the release profile without LTO and with
# parallel codegen, so each mutant builds in a fraction of the time; never measured.
[profile.mutant]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
